# ============================================================================
# dsh-bili-faship —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 插件挂进 profile 的方式（二选一）：
#   ① 官方插件管理：设置 → 插件 → 安装本地包（或 plugin_manager install_bundle）
#   ② CLI（本地开发）：
#        dsh plugin --profile desktop add link:<你 clone 下来的插件目录>
#      然后把 "dsh-bili-faship" 加进 profile package.json 的 dsh.profile.bundles。
#
# 装完后设置页在：设置 → 视频工坊（/dsh-bili-faship/api/* 由插件宿主半端提供）
#
# ⚠️ `name:` 必须与安装后的**包名**一致（dsh-bili-faship），否则表现为
#    「装上了但设置页 404 / entry did not activate」。
# ============================================================================

- insert:
    - id: bili-faship
      name: dsh-bili-faship
      config:
        enabled: true
